<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raw Script — Zeox.xyz</title>
<style>
  /* Minimal raw viewer — returns plain text for loaders */
  :root{--bg:#070707;--surface:#131313;--line:rgba(255,255,255,0.09);--line-soft:rgba(255,255,255,0.05);--text:#f5f5f5;--text-dim:#9a9a9a;--text-faint:#5e5e5e;--green:#7bd88f;--red:#ff5b5b;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace,-apple-system,sans-serif;min-height:100vh;}
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');

  /* top bar */
  .topbar{
    position:sticky;top:0;z-index:10;
    background:rgba(7,7,7,.9);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line-soft);
    padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    font-family:'Inter',sans-serif;
  }
  .topbar-left{display:flex;align-items:center;gap:10px;}
  .brand-sm{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;}
  .brand-sm img{width:22px;height:22px;border-radius:6px;object-fit:cover;}
  .brand-sm .lf{width:22px;height:22px;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;color:#000;font-size:10px;}
  .sep{color:var(--line);font-size:14px;}
  .file-name{font-size:12px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .topbar-right{display:flex;gap:8px;}
  .tb-btn{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;
    padding:7px 14px;border-radius:8px;border:1px solid var(--line-soft);
    background:transparent;color:var(--text-dim);cursor:pointer;font-family:'Inter',sans-serif;
    transition:all .15s;
  }
  .tb-btn:hover{color:var(--text);border-color:rgba(255,255,255,.18);}
  .tb-btn.primary{background:#fff;color:#0a0a0a;border-color:#fff;}
  .tb-btn.primary:hover{background:#e2e2e2;}
  .tb-btn.copied{color:var(--green);border-color:rgba(123,216,143,.25);}

  /* loading / error states */
  .state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:60vh;gap:12px;text-align:center;padding:40px;
  }
  .state i{font-size:28px;color:var(--text-faint);}
  .state .msg{font-size:14px;color:var(--text-dim);font-family:'Inter',sans-serif;}
  .state .sub{font-size:12.5px;color:var(--text-faint);font-family:'Inter',sans-serif;}
  .spin{animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* code view */
  .code-wrap{display:none;padding:24px 20px;}
  .code-wrap.show{display:block;}
  .code-block{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  }
  .code-meta{
    padding:10px 16px;border-bottom:1px solid var(--line-soft);
    display:flex;align-items:center;justify-content:space-between;
    font-family:'Inter',sans-serif;font-size:12px;color:var(--text-faint);
  }
  pre{
    padding:20px;font-size:12px;line-height:1.75;overflow-x:auto;
    color:#d0d0d0;white-space:pre-wrap;word-break:break-all;
  }
  pre .watermark{color:#5e5e5e;}
</style>
</head>
<body>

<!-- top bar (shown once loaded) -->
<div class="topbar" id="topbar" style="display:none;">
  <div class="topbar-left">
    <div class="brand-sm">
      <img src="https://cdn.discordapp.com/attachments/1517899652844752906/1523469630822154240/20_20260706022411.png?ex=6a4c3928&is=6a4ae7a8&hm=35fc4505b3f9d7be336806c812003a40f71da9e9e7a638ac4e21ed4a995848ce&"
           alt="Zeox" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'lf',innerHTML:'<i class=\'fa-solid fa-lock\'></i>'}))">
      Zeox.xyz
    </div>
    <span class="sep">/</span>
    <span class="file-name" id="topFileName">script.lua</span>
  </div>
  <div class="topbar-right">
    <button class="tb-btn" id="copyRawBtn" onclick="copyRaw()"><i class="fa-solid fa-copy"></i> Copy</button>
    <button class="tb-btn primary" onclick="downloadRaw()"><i class="fa-solid fa-download"></i> Download</button>
  </div>
</div>

<!-- states -->
<div class="state" id="stateLoading">
  <i class="fa-solid fa-circle-notch spin"></i>
  <div class="msg">Loading script…</div>
</div>
<div class="state" id="stateError" style="display:none;">
  <i class="fa-solid fa-triangle-exclamation"></i>
  <div class="msg" id="errMsg">Script not found.</div>
  <div class="sub">The link may have expired or been removed.</div>
  <a href="/" style="margin-top:8px;font-size:13px;color:var(--text-dim);font-family:'Inter',sans-serif;">← Back to Zeox.xyz</a>
</div>

<!-- code view -->
<div class="code-wrap" id="codeWrap">
  <div class="code-block">
    <div class="code-meta">
      <span id="metaName"></span>
      <span id="metaSize"></span>
    </div>
    <pre id="codeContent"></pre>
  </div>
</div>

<!-- fa icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";

  const cfg = {
    apiKey:"AIzaSyCg41nrI9GosXvb_5vuOixSDpbzeYuct20",
    authDomain:"zeoxxyz.firebaseapp.com",
    databaseURL:"https://zeoxxyz-default-rtdb.firebaseio.com",
    projectId:"zeoxxyz",
    storageBucket:"zeoxxyz.firebasestorage.app",
    messagingSenderId:"896346061745",
    appId:"1:896346061745:web:d1fde2af1ee3eef26ddb90"
  };
  const app = initializeApp(cfg);
  const db  = getDatabase(app);

  // Get script ID from URL: /r/SCRIPT_ID
  const id = window.location.pathname.split('/').filter(Boolean).pop();

  if (!id || id === 'r') {
    showError('No script ID in URL.');
  } else {
    get(ref(db, 'scripts/' + id)).then(snap => {
      if (!snap.exists()) { showError('Script not found.'); return; }
      const data = snap.val();
      renderScript(data.name || 'script.lua', data.code || '');
    }).catch(err => {
      showError('Failed to load: ' + err.message);
    });
  }

  function renderScript(name, code) {
    document.getElementById('stateLoading').style.display = 'none';
    document.getElementById('topbar').style.display = 'flex';
    document.getElementById('codeWrap').classList.add('show');

    document.getElementById('topFileName').textContent = name;
    document.getElementById('metaName').textContent = name;
    document.getElementById('metaSize').textContent = (new TextEncoder().encode(code).length / 1024).toFixed(2) + ' KB';

    // Highlight watermark line
    const lines = code.split('\n');
    const html  = lines.map((l, i) =>
      i === 0 ? `<span class="watermark">${escHtml(l)}</span>` : escHtml(l)
    ).join('\n');
    document.getElementById('codeContent').innerHTML = html;

    window.__rawCode = code;
    window.__rawName = name;

    // Set page title
    document.title = name + ' — Zeox.xyz';
  }

  function showError(msg) {
    document.getElementById('stateLoading').style.display = 'none';
    document.getElementById('errMsg').textContent = msg;
    document.getElementById('stateError').style.display = 'flex';
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  window.copyRaw = function() {
    if (!window.__rawCode) return;
    navigator.clipboard.writeText(window.__rawCode);
    const btn = document.getElementById('copyRawBtn');
    btn.classList.add('copied');
    btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '<i class="fa-solid fa-copy"></i> Copy'; }, 2000);
  };

  window.downloadRaw = function() {
    if (!window.__rawCode) return;
    const blob = new Blob([window.__rawCode], { type: 'text/plain' });
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = window.__rawName || 'encrypted.lua';
    a.click();
    URL.revokeObjectURL(a.href);
  };
</script>

</body>
</html>
